name: engine-detect

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/kuvryn-manifest-check --root .
      - run: go run ./cmd/kuvryn-engine-detect --root . --output update-plan.json
      - id: matrix
        run: |
          jq -c '{include: [.flavors[] | select(.changed == true)]}' update-plan.json > matrix.json
          printf 'matrix=%s\n' "$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-update-plan
          path: update-plan.json
