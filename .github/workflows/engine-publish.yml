name: engine-publish

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to publish
        required: true
      digest:
        description: Image digest to tag after CT
        required: true
      ct_report_base64:
        description: Optional base64-encoded CT report JSON to write before publish
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: go test ./...
      - run: go run ./cmd/kuvryn-manifest-check --root .
      - name: Materialize CT report input
        if: ${{ inputs.ct_report_base64 != '' }}
        env:
          FLAVOR: ${{ inputs.flavor }}
          CT_REPORT_BASE64: ${{ inputs.ct_report_base64 }}
        run: |
          mkdir -p ct-reports
          printf '%s' "$CT_REPORT_BASE64" | base64 --decode > "ct-reports/${FLAVOR}.json"
      - name: Publish gated image
        env:
          FLAVOR: ${{ inputs.flavor }}
          DIGEST: ${{ inputs.digest }}
        run: ci/build/publish-image.sh "$FLAVOR" "$DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-lock-${{ inputs.flavor }}
          path: |
            lock-updates/*.upstream.lock
            publish-artifacts/${{ inputs.flavor }}/*
