schema: kuvryn.engine-image/v1
name: llama-cpp-amd-vulkan
engine: llama-cpp
vendor: amd
variant: vulkan
image:
  repository: ghcr.io/azrtydxb/kuvryn-ai-engine/llama-cpp-amd-vulkan
  platforms:
    - linux/amd64
  base:
    image: ubuntu
    tag: "24.04"
build:
  context: .
  dockerfile: engines/llama-cpp/amd-vulkan/Dockerfile
  args:
    ENGINE: llama-cpp
    VENDOR: amd
    LLAMA_CPP_REF: v0.5.0
capabilities:
  accelerators:
    - amd
    - intel
  collective: none
  distributed: false
  rdma: optional
  rayRequired: false
upstreams:
  - name: engine
    type: static-version
    version: v0.5.0
  - name: base-image
    type: container-digest
    image: ubuntu:24.04
    digest: sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
publish:
  certification: hardware-untested
  tags:
    - digest
    - hardware-untested
tests:
  - name: static
    type: static
    required: true
  - name: runtime-command
    type: runtime-command
    required: true
  - name: vendor-device
    type: vendor-device
    required: false
    runner:
      - amd
      - intel
labels:
  org.opencontainers.image.source: https://github.com/azrtydxb/kuvryn-ai-engine
  kuvryn.engine: llama-cpp
  kuvryn.vendor: amd
  kuvryn.variant: vulkan
  kuvryn.flavor: llama-cpp-amd-vulkan
  kuvryn.certification: hardware-untested
