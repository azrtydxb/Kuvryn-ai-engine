schema: kuvryn.engine-image/v1
name: llama-cpp-amd
engine: llama-cpp
vendor: amd
variant: default
image:
  repository: ghcr.io/azrtydxb/kuvryn-ai-engine/llama-cpp-amd
  platforms:
    - linux/amd64
  base:
    image: rocm/dev-ubuntu-24.04
    tag: 10.0.0-full
build:
  context: .
  dockerfile: engines/llama-cpp/amd/Dockerfile
  args:
    ENGINE: llama-cpp
    VENDOR: amd
    LLAMA_CPP_REF: v0.5.0
    LLAMA_CPP_GPU_TARGETS: gfx908;gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201
capabilities:
  accelerators:
    - amd
  collective: rccl
  distributed: true
  rdma: optional
  rayRequired: false
upstreams:
  - name: engine
    type: static-version
    version: v0.5.0
  - name: base-image
    type: container-digest
    image: rocm/dev-ubuntu-24.04:10.0.0-full
    digest: sha256:518ced857e9bc4f27392985257dcdf19c43d28918ff6e60074ea09ceb9edd19d
publish:
  certification: hardware-untested
  tags:
    - digest
    - hardware-untested
tests:
  - name: static
    type: static
    required: true
  - name: runtime-command
    type: runtime-command
    required: true
  - name: vendor-device
    type: vendor-device
    required: false
    runner:
      - amd
labels:
  org.opencontainers.image.source: https://github.com/azrtydxb/kuvryn-ai-engine
  kuvryn.engine: llama-cpp
  kuvryn.vendor: amd
  kuvryn.flavor: llama-cpp-amd
  kuvryn.certification: hardware-untested
