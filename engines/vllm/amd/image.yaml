schema: kuvryn.engine-image/v1
name: vllm-amd
engine: vllm
vendor: amd
variant: default
image:
  repository: ghcr.io/azrtydxb/kuvryn-ai-engine/vllm-amd
  platforms:
    - linux/amd64
  base:
    image: ubuntu
    tag: "24.04"
build:
  context: .
  dockerfile: engines/vllm/amd/Dockerfile
  args:
    ENGINE: vllm
    VENDOR: amd
    VLLM_VERSION: 0.30.0
    RAY_VERSION: 2.58.0
    ROCM_VERSION: 10.0.0
    TORCH_VERSION: 2.13.0+rocm10.0.0
    TORCHVISION_VERSION: 0.28.0+rocm10.0.0
    TRITON_VERSION: 3.8.0+git4cff872c.rocm10.0.0
    AITER_REF: v0.1.22.post1
    PYTORCH_ROCM_ARCH: gfx90a;gfx942;gfx950;gfx1100;gfx1101;gfx1150;gfx1151;gfx1200;gfx1201
capabilities:
  accelerators:
    - amd
  collective: rccl
  distributed: true
  rdma: optional
  rayRequired: true
upstreams:
  - name: engine
    type: static-version
    version: 0.30.0
  - name: base-image
    type: container-digest
    image: ubuntu:24.04
    digest: sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  - name: rocm
    type: static-version
    version: 10.0.0
  - name: torch
    type: static-version
    version: 2.13.0+rocm10.0.0
  - name: aiter
    type: github-tag
    repository: ROCm/aiter
    ref: v0.1.22.post1
  - name: ray
    type: pypi-version
    package: ray
    version: 2.58.0
publish:
  certification: hardware-untested
  tags:
    - digest
    - hardware-untested
tests:
  - name: static
    type: static
    required: true
  - name: runtime-command
    type: runtime-command
    required: true
  - name: vendor-device
    type: vendor-device
    required: false
    runner:
      - amd
labels:
  org.opencontainers.image.source: https://github.com/azrtydxb/kuvryn-ai-engine
  kuvryn.engine: vllm
  kuvryn.vendor: amd
  kuvryn.flavor: vllm-amd
  kuvryn.certification: hardware-untested
