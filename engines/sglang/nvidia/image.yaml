schema: kuvryn.engine-image/v1
name: sglang-nvidia
engine: sglang
vendor: nvidia
variant: default
image:
  repository: ghcr.io/azrtydxb/kuvryn-ai-engine/sglang-nvidia
  platforms:
    - linux/amd64
    - linux/arm64
  base:
    image: nvcr.io/nvidia/pytorch
    tag: 25.06-py3
build:
  context: .
  dockerfile: engines/sglang/nvidia/Dockerfile
  args:
    ENGINE: sglang
    VENDOR: nvidia
    SGLANG_VERSION: 0.5.19
capabilities:
  accelerators:
    - nvidia
  collective: nccl
  distributed: true
  rdma: optional
  rayRequired: false
upstreams:
  - name: engine
    type: static-version
    version: 0.5.19
  - name: base-image
    type: container-digest
    image: nvcr.io/nvidia/pytorch:25.06-py3
    digest: sha256:025d9b102b5436d4af8af58f12c6a46b7e5d16f19543b1d2cc4446bf2650b4f1
publish:
  certification: hardware-certified
  tags:
    - digest
    - latest
tests:
  - name: static
    type: static
    required: true
  - name: runtime-command
    type: runtime-command
    required: true
  - name: vendor-device
    type: vendor-device
    required: true
    runner:
      - nvidia
labels:
  org.opencontainers.image.source: https://github.com/azrtydxb/kuvryn-ai-engine
  kuvryn.engine: sglang
  kuvryn.vendor: nvidia
  kuvryn.flavor: sglang-nvidia
  kuvryn.certification: hardware-certified
